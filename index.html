<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080711">
<title>MARCHERITO FIGHTERS — EDICIÓN B ANIMADA</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;height:100dvh;background:#080711;overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:system-ui,Arial,sans-serif}
  #game{display:block;flex:none;touch-action:none;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 50px rgba(255,140,40,.25)}
  #touchDock{display:none;flex:none;position:relative;width:100%;max-width:1060px;height:178px;align-items:center;justify-content:space-between;padding:7px max(14px,env(safe-area-inset-right)) 7px max(14px,env(safe-area-inset-left));gap:12px;touch-action:none;user-select:none;-webkit-user-select:none}
  .touchGroup{display:flex;align-items:center;gap:8px}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}
  .touchBtn{appearance:none;border:2px solid #86a8e9;border-radius:14px;background:linear-gradient(160deg,#364b85d9,#111a35ed);color:#fff;font:bold 19px system-ui;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #080e22;min-width:48px;min-height:48px;padding:0;cursor:pointer}
  .touchBtn:active,.touchBtn.isDown{background:linear-gradient(160deg,#fff1a8,#e86c20);color:#171126;transform:translateY(3px);box-shadow:0 1px 0 #080e22;border-color:#fff0a1}
  .pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
  .actions{display:grid;grid-template-columns:repeat(3,minmax(62px,76px));gap:9px;align-items:center}
  .actions .touchBtn{min-height:67px;border-radius:50%;font-size:13px;font-weight:900}
  .actions [data-control="punch"]{border-color:#7fd3ff}.actions [data-control="kick"]{border-color:#ffd16c}.actions [data-control="special"]{border-color:#ff827a;background:linear-gradient(160deg,#a33c51,#4a1335)}
  #touchMenu{display:none;width:100%;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
  #touchMenu .touchBtn{padding:0 22px;font-size:16px;min-height:56px}
  #touchHint{position:absolute;bottom:2px;left:0;right:0;text-align:center;color:#b7c6ee;font-size:10px;pointer-events:none}
  @media (pointer:coarse), (any-pointer:coarse){body{justify-content:center}#touchDock{display:flex}}
  body.forceTouch #touchDock{display:flex}
  body.menuTouch #touchMenu{display:flex}body.menuTouch .gameTouch{display:none}
  @media (max-width:550px){#touchDock{height:164px;padding-left:8px;padding-right:8px;gap:2px}.pad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px)}.touchBtn{min-width:43px;min-height:43px}.actions{grid-template-columns:repeat(3,53px);gap:5px}.actions .touchBtn{min-height:60px;font-size:11px}#touchHint{font-size:9px}}
  @media (max-height:450px) and (orientation:landscape){#touchDock{height:130px}.pad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:2px}.touchBtn{min-width:38px;min-height:38px}.actions .touchBtn{min-height:57px}}

</style>
</head>
<body>
<canvas id="game" width="960" height="540" aria-label="Marcherito Fighters, juego de lucha"></canvas>
<div id="touchDock" aria-label="Controles táctiles">
 <div class="touchGroup gameTouch pad" aria-label="Movimiento">
  <button class="touchBtn up" data-control="up" aria-label="Saltar">▲</button>
  <button class="touchBtn left" data-control="left" aria-label="Mover a la izquierda">◀</button>
  <button class="touchBtn down" data-control="down" aria-label="Agacharse">▼</button>
  <button class="touchBtn right" data-control="right" aria-label="Mover a la derecha">▶</button>
 </div>
 <div id="touchMenu">
  <button class="touchBtn" id="touchMode" aria-label="Cambiar modo">CPU / 2P</button>
  <button class="touchBtn" id="touchStart" aria-label="Comenzar combate">▶ LUCHAR</button>
 </div>
 <div class="touchGroup gameTouch actions" aria-label="Ataques">
  <button class="touchBtn" data-control="punch" aria-label="Puñetazo">PUÑO</button>
  <button class="touchBtn" data-control="kick" aria-label="Patada">PATADA</button>
  <button class="touchBtn" data-control="special" aria-label="Ataque especial">ESPECIAL</button>
 </div>
 <div id="touchHint">Mantén ATRÁS para defenderte · Puedes pulsar movimiento y ataque a la vez</div>
</div>
<script>
'use strict';
// =====================================================================
//  MARCHERITO FIGHTERS — juego de lucha 2D con sprites de seis personajes (HTML5 Canvas)
// =====================================================================
const W = 960, H = 540, GROUND = 492, LEFT_WALL = 45, RIGHT_WALL = W - 45;
const OUT = '#140c0a';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
// Buffer a media resolución -> aspecto pixel art al escalar sin suavizado
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bx = buf.getContext('2d');
const bgC = document.createElement('canvas'); bgC.width = W; bgC.height = H;

function fit() {
  const dock=document.getElementById('touchDock');
  const dockVisible=getComputedStyle(dock).display!=='none';
  const availableHeight=Math.max(90,innerHeight-(dockVisible?dock.getBoundingClientRect().height:0));
  const s = Math.min(innerWidth / W,availableHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); addEventListener('orientationchange',()=>setTimeout(fit,120)); fit();

// ---------------------------------------------------------------------
//  Utilidades
// ---------------------------------------------------------------------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = Math.random;
let seed = 1337;
const srand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function circ(g, x, y, r, col) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); if (col) { g.fillStyle = col; g.fill(); } }
function ell(g, x, y, rx, ry, col) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fillStyle = col; g.fill(); }
function limb(g, a, b, w, col) {
  g.lineCap = 'round'; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
  g.strokeStyle = OUT; g.lineWidth = w + 5; g.stroke();
  g.strokeStyle = col; g.lineWidth = w; g.stroke();
}
function poly(g, pts, fill, stroke = true) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (stroke) { g.strokeStyle = OUT; g.lineWidth = 4; g.lineJoin = 'round'; g.stroke(); }
  g.fillStyle = fill; g.fill();
}

// ---------------------------------------------------------------------
//  Audio sintetizado (WebAudio, sin archivos externos)
// ---------------------------------------------------------------------
let AC = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, slide) {
  if (!AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  if (!AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + dur + 0.02);
}
function sfx(n) {
  switch (n) {
    case 'swing': noise(0.08, 0.12, 2500); break;
    case 'hit': noise(0.15, 0.5, 900); tone(150, 0.14, 'square', 0.2, 50); break;
    case 'heavy': noise(0.25, 0.6, 700); tone(110, 0.25, 'square', 0.28, 40); break;
    case 'block': tone(900, 0.06, 'square', 0.12, 500); noise(0.05, 0.2, 4000); break;
    case 'jump': tone(300, 0.1, 'triangle', 0.1, 600); break;
    case 'special': tone(180, 0.4, 'sawtooth', 0.15, 900); noise(0.3, 0.2, 1500); break;
    case 'ko': tone(420, 0.9, 'sawtooth', 0.22, 60); noise(0.6, 0.4, 600); break;
    case 'tick': tone(1200, 0.05, 'square', 0.06); break;
    case 'fight': tone(523, 0.12, 'square', 0.14); setTimeout(() => tone(784, 0.25, 'square', 0.14), 120); break;
    case 'land': noise(0.06, 0.15, 400); break;
  }
}

// ---------------------------------------------------------------------
//  Entrada de teclado
// ---------------------------------------------------------------------
const keys = {}; let pressed = {};
const CTRL = {
  p1: { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], punch: ['KeyF'], kick: ['KeyG'], special: ['KeyR'] },
  p2: { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
        punch: ['Numpad4', 'KeyK'], kick: ['Numpad5', 'KeyL'], special: ['Numpad6', 'KeyP'] }
};
const P2CODES = Object.values(CTRL.p2).flat();
const EMPTY = { left: false, right: false, up: false, down: false, punch: false, kick: false, special: false };
let p2Human = false;

addEventListener('keydown', e => {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (P2CODES.includes(e.code) && !p2Human && game.state === 'fight') {
    p2Human = true; banner('¡JUGADOR 2 SE UNE AL COMBATE!');
  }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code) || e.code.startsWith('Numpad')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// Entradas táctiles simultáneas con Pointer Events: teclado y pantalla se pueden combinar.
const touchHeld={left:false,right:false,up:false,down:false,punch:false,kick:false,special:false};
const touchPressed={punch:false,kick:false,special:false};
const touchPointers=new Map();
const touchButtons=[...document.querySelectorAll('[data-control]')];
function syncTouchButtons(){
  const active=new Set(touchPointers.values());
  for(const key of Object.keys(touchHeld))touchHeld[key]=active.has(key);
  for(const b of touchButtons)b.classList.toggle('isDown',active.has(b.dataset.control));
}
for(const btn of touchButtons){
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();initAudio();if(AC&&AC.state==='suspended')AC.resume();
    const key=btn.dataset.control;
    if(!touchHeld[key]&&key in touchPressed)touchPressed[key]=true;
    touchPointers.set(e.pointerId,key);btn.setPointerCapture(e.pointerId);syncTouchButtons();
  });
  const release=e=>{if(touchPointers.delete(e.pointerId))syncTouchButtons();};
  btn.addEventListener('pointerup',release);btn.addEventListener('pointercancel',release);btn.addEventListener('lostpointercapture',release);
  btn.addEventListener('contextmenu',e=>e.preventDefault());
}
addEventListener('blur',()=>{touchPointers.clear();syncTouchButtons();});
addEventListener('visibilitychange',()=>{if(document.hidden){touchPointers.clear();syncTouchButtons();}});
function readInput(map, includeTouch=false) {
  const any = a => a.some(c => keys[c]), edge = a => a.some(c => pressed[c]);
  const input={ left: any(map.left), right: any(map.right), up: any(map.up), down: any(map.down),
           punch: edge(map.punch), kick: edge(map.kick), special: edge(map.special) };
  if(includeTouch)for(const key of Object.keys(input))input[key] ||= (key in touchPressed ? touchPressed[key] : touchHeld[key]);
  return input;
}
function clearTouchEdges(){for(const key of Object.keys(touchPressed))touchPressed[key]=false;}
function beginSelectedMatch(){rivalSelection=(selection+1+Math.floor(Math.random()*5))%6;startMatch();}
document.getElementById('touchStart').addEventListener('click',()=>{
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(game.state==='title')beginSelectedMatch();
  else if(game.state==='victory'){game.state='title';game.stateT=0;}
});
document.getElementById('touchMode').addEventListener('click',()=>{p2Human=!p2Human;sfx('tick');});
// Pulsar una tarjeta en la pantalla de selección elige al luchador.
cv.addEventListener('pointerdown',e=>{
  if(game.state!=='title')return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  const col=Math.floor((x-100)/260),row=Math.floor((y-145)/129);
  if(col>=0&&col<3&&row>=0&&row<2){
    const dx=x-(100+col*260),dy=y-(145+row*129);
    if(dx>=0&&dx<=242&&dy>=0&&dy<=117){selection=row*3+col;initAudio();sfx('tick');}
  } else if(y>=495){initAudio();beginSelectedMatch();}
  else if(y>=447&&y<480){p2Human=!p2Human;sfx('tick');}
});
if(new URLSearchParams(location.search).has('touch'))document.body.classList.add('forceTouch');
function updateTouchUi(){
  const isMenu=game.state==='title'||game.state==='victory';
  document.body.classList.toggle('menuTouch',isMenu);
  document.getElementById('touchStart').textContent=game.state==='victory'?'↩ ELEGIR PERSONAJE':'▶ LUCHAR';
  document.getElementById('touchMode').textContent=p2Human?'MODO: 2 JUGADORES':'MODO: CPU';
}

// ---------------------------------------------------------------------
//  Datos de ataques (fotogramas a 60 fps; cajas en coords locales mirando a la derecha)
// ---------------------------------------------------------------------
const ATTACKS = {
  punch:   { startup: 4, active: 4, recovery: 9,  box: { x: 22, y: -162, w: 72, h: 28 }, dmg: 6,  hs: 14, bs: 9,  kb: 5, lvl: 'mid',  pose: 'punch' },
  kick:    { startup: 8, active: 5, recovery: 16, box: { x: 18, y: -120, w: 94, h: 34 }, dmg: 11, hs: 20, bs: 13, kb: 9, lvl: 'mid',  pose: 'kick', heavy: true },
  cpunch:  { startup: 4, active: 4, recovery: 9,  box: { x: 24, y: -104, w: 68, h: 28 }, dmg: 5,  hs: 13, bs: 8,  kb: 4, lvl: 'mid',  pose: 'cpunch' },
  ckick:   { startup: 7, active: 5, recovery: 18, box: { x: 14, y: -48,  w: 98, h: 32 }, dmg: 9,  hs: 18, bs: 12, kb: 7, lvl: 'low',  pose: 'ckick', heavy: true },
  jkick:   { startup: 5, active: 16, recovery: 0,  box: { x: 10, y: -72,  w: 74, h: 54 }, dmg: 10, hs: 18, bs: 12, kb: 6, lvl: 'over', pose: 'jkick', heavy: true },
  uppercut:{ startup: 5, active: 12, recovery: 10, box: { x: 8, y: -182, w: 80, h: 122 }, dmg: 15, hs: 24, bs: 11, kb: 9, lvl: 'mid', poseStart: 'charge', pose: 'uppercut', heavy: true, launchVy: -15.5, launchVx: 4.8, cool: 60, moveName: '¡GOLPE ASCENDENTE!' },
  spin:    { startup: 6, active: 14, recovery: 16, box: { x: 14, y: -124, w: 110, h: 60 }, dmg: 14, hs: 20, bs: 12, kb: 10, lvl: 'mid', poseStart: 'charge', pose: 'spin', heavy: true, dash: 8.5, cool: 55, moveName: '¡GIRO TORNADO!' }
};

// ---------------------------------------------------------------------
//  Personajes (adaptados de la foto)
// ---------------------------------------------------------------------
const VAQUERO = {
  name: 'TORO VAQUERO', special: 'rush', specialName: '¡EMBESTIDA DEL TORO!',
  quote: '¡En el Marcherito mando yo! Camarero... ¡otra ronda!',
  specialData: { startup: 14, active: 20, recovery: 16, box: { x: 0, y: -178, w: 64, h: 150 }, dmg: 15, chip: 3,
                 hs: 26, bs: 16, kb: 14, lvl: 'mid', dash: 13, cool: 80, heavy: true, poseStart: 'charge', pose: 'rush' },
  c: { kind: 'vaq', skin: '#e2a67c', skinD: '#b77a54', hair: '#cfcfcf', hairD: '#8a8a8a', hairL: '#f0f0f0',
       shirt: '#f4f1ea', shirtD: '#c9c4b8', vest: '#4f7fc0', vestD: '#2f5a92', vestL: '#86aee3',
       pants: '#3f6db0', pantsD: '#2c5089', boot: '#7a3f22', bootD: '#5a2c17', sole: '#2a1a10',
       belt: '#6b3d1f', glove: '#1d1d22', accent: '#4f7fc0' }
};
const CALAVERA = {
  name: 'EL CALAVERA', special: 'fireball', specialName: '¡CALAVERA DE FUEGO!',
  quote: 'Rock, cuero y calaveras. ¡Vuelve cuando sepas bailar!',
  specialData: { startup: 16, active: 1, recovery: 24, projectile: true, dmg: 12, chip: 3, hs: 20, bs: 14, kb: 8,
                 lvl: 'mid', cool: 70, speed: 8.5, heavy: true, poseStart: 'fbCharge', pose: 'fbThrow' },
  c: { kind: 'cal', skin: '#d9a07a', skinD: '#a8704f', hair: '#4b4b52', hairD: '#26262b', hairL: '#9a9aa6',
       shirt: '#5d6170', shirtD: '#454856', jacket: '#1f1f25', jacketD: '#121216', jacketL: '#4d4d5a',
       pants: '#8c919c', pantsD: '#6b707a', boot: '#1a1a1e', bootD: '#0e0e11', sole: '#050505',
       belt: '#111114', glove: '#1d1d22', accent: '#e23b2b' }
};

// Seis luchadores seleccionables inspirados en la ilustración original.
function makeFighter(base, name, kind, palette, special, specialName, quote, speed=1, power=1) {
  const c = {...base.c, ...palette, kind};
  const d = {...(special === 'fireball' ? CALAVERA.specialData : VAQUERO.specialData)};
  if (special === 'fireball') { d.speed = 7.5 + speed; d.dmg = Math.round(12 * power); }
  else { d.dash = 11 + speed * 2; d.dmg = Math.round(15 * power); }
  return {name, c, special, specialName, quote, specialData:d, speed, power};
}
const RYU = makeFighter(VAQUERO, 'EL DRAGÓN', 'karate', {
 skin:'#e6a277',skinD:'#ad674a',hair:'#17151c',hairD:'#0a0a0e',hairL:'#37323a',
 shirt:'#f5f1e9',shirtD:'#bfbab4',vest:'#f5f1e9',vestD:'#bfbab4',vestL:'#ffffff',
 pants:'#f5f1e9',pantsD:'#c5c0b7',boot:'#d59b70',bootD:'#9c6748',sole:'#a47752',
 glove:'#d72730',belt:'#19171d',accent:'#ed3838'
},'fireball','¡PUÑO DEL DRAGÓN!','¡La disciplina vence a la fuerza!',1.13,.96);
const CAMARERO = makeFighter(VAQUERO,'EL PATRÓN','waiter',{
 skin:'#dca077',skinD:'#ad6b4e',hair:'#3b2725',hairD:'#211719',hairL:'#73564a',
 shirt:'#fff7ee',shirtD:'#d2c6bb',vest:'#fff7ee',vestD:'#d2c6bb',vestL:'#ffffff',
 pants:'#3c3540',pantsD:'#27212a',boot:'#28232a',bootD:'#17141b',sole:'#111016',
 belt:'#a42d2a',glove:'#25242b',accent:'#e7b14d'
},'rush','¡CUENTA PENDIENTE!','¡Aquí se sirve con carácter!',.96,1.06);
const SOLDADO = makeFighter(CALAVERA,'EL COMANDO','soldier',{
 skin:'#c68e69',skinD:'#935d43',hair:'#191a16',hairD:'#0c0e0a',hairL:'#454837',
 shirt:'#667c45',shirtD:'#455532',jacket:'#667c45',jacketD:'#40512e',jacketL:'#8ca064',
 pants:'#566d3a',pantsD:'#37472c',boot:'#26251e',bootD:'#151610',sole:'#10100d',
 belt:'#2c3222',glove:'#292b24',accent:'#a6c16a'
},'rush','¡OPERACIÓN RELÁMPAGO!','¡Misión cumplida!',.98,1.1);
const FUEGO = makeFighter(VAQUERO,'EL FUEGO','red',{
 skin:'#e2a07a',skinD:'#ad6748',hair:'#292021',hairD:'#151012',hairL:'#554042',
 shirt:'#c83229',shirtD:'#861d20',vest:'#d93b2e',vestD:'#8d2020',vestL:'#f46a42',
 pants:'#f4e8d9',pantsD:'#c5b4a3',boot:'#a62027',bootD:'#61141b',sole:'#23191c',
 belt:'#4a2523',glove:'#b72229',accent:'#ff6438'
},'fireball','¡LLAMARADA ROJA!','¡Hoy se enciende la terraza!',1.08,1.04);
const ROSTER = [RYU, VAQUERO, CAMARERO, SOLDADO, FUEGO, CALAVERA];

// Sprites extraídos de las seis hojas de poses generadas para los personajes.
// Orden: reposo, avanzar, puñetazo, patada, defensa agachada, salto/ataque aéreo.
const SPRITE_NAMES = ['dragon','vaquero','patron','comando','fuego','calavera'];
const spriteSheets = SPRITE_NAMES.map(name => Array.from({length:18},(_,i)=>{
  const im=new Image(); im.decoding='async'; im.src=`sprites_anim/${name}_${String(i).padStart(2,'0')}.png`;return im;
}));
function spriteFor(def,index=0) {const i=ROSTER.indexOf(def);return spriteSheets[Math.max(0,i)]?.[index];}
function validSprite(im){return im && im.complete && im.naturalWidth>0;}
// Tabla de animación: 18 fotogramas por personaje, con ciclos vinculados a estados de combate.
// 0,1 reposo; 2,3 caminar; 4,5 puñetazo; 6,7 patada; 8,9 defensa; 10,11 salto;
// 12,13 recibir golpe; 14 recuperación; 15 victoria; 16,17 especial.
function spritePose(f){
  const t=f.animT;
  if(f.state==='ko')return 13;
  if(f.stunType==='hit')return f.stun>8?12:13;

  arcadeText('MARCHERITO FIGHTERS',W/2,57,64,'#fff6ba','#ff6d21');
  smallText('SELECT YOUR FIGHTER  •  ELIGE TU LUCHADOR',W/2,112,19,'#fbe7c4');
  const x0=100,y0=145,cw=242,ch=117,gap=18;
  for(let i=0;i<6;i++) {
    const x=x0+(i%3)*(cw+gap),y=y0+Math.floor(i/3)*(ch+12),def=ROSTER[i],sel=i===selection;
    ctx.fillStyle=sel?'#322d63':'rgba(12,15,35,.88)';ctx.fillRect(x,y,cw,ch);
    ctx.strokeStyle=sel?'#ffe359':'#68769b';ctx.lineWidth=sel?5:2;ctx.strokeRect(x,y,cw,ch);
    if(sel) {ctx.fillStyle='#ffe359';ctx.fillRect(x+4,y+4,cw-8,4);}
    ctx.save();ctx.beginPath();ctx.rect(x+5,y+7,90,91);ctx.clip();
    const im=spriteFor(def,0);
    if(validSprite(im)){
      ctx.imageSmoothingEnabled=false;ctx.drawImage(im,x+5,y+4,97,99);
    }else{ctx.translate(x+48,y+48);ctx.scale(1.35,1.35);drawBust(ctx,def.c,'angry');}
    ctx.restore();
    smallText(def.name,x+104,y+35,16,sel?'#ffe359':'#ffffff','left');
    smallText(def.special==='rush'?'EMBESTIDA':'PROYECTIL',x+104,y+60,12,'#b6d7ff','left');
    smallText('PODER '+Math.round((def.power||1)*100)+'%',x+104,y+82,12,'#ffb48a','left');
    if(sel) arcadeText('1P',x+21,y-8,22,'#ffffff','#ff542a');
  }
  smallText('TOCA TU PERSONAJE O USA A / D  ·  ENTER PARA LUCHAR',W/2,431,17,'#fff2b1');
  smallText('108 FOTOGRAMAS · 18 POR LUCHADOR · COMBOS Y ATAQUES ESPECIALES',W/2,450,14,'#ffdcb0');
  smallText('C: MODO '+(p2Human?'2 JUGADORES':'CONTRA CPU')+'      |      PRIMERO EN GANAR 2 RONDAS',W/2,472,15,'#b6d7ff');
  smallText('J1: A D W S + F G R    |    J2: FLECHAS + K L P    |    ESPECIALES POR COMBINACIÓN',W/2,500,14,'#ffffff');
  if((game.stateT>>5)%2===0) arcadeText('¡PULSA ENTER O TOCA LUCHAR!',W/2,524,23,'#ffffff','#ffb022');
  ctx.restore();
}

function drawVictory() {
  const t = game.stateT, w = game.champion;
  ctx.fillStyle = `rgba(5,3,15,${Math.min(.75, t / 40)})`; ctx.fillRect(0, 0, W, H);
  if (t < 15) return;
  arcadeText('¡VICTORIA!', W / 2, 80, 84, '#fff2a8', '#ff7a00');
  portrait(150, 150, w, false, 210);
  arcadeText(w.def.name, 620, 200, 52, '#ffffff', w.idx === 0 ? '#4f7fc0' : '#e23b2b');
  arcadeText('GANA ' + game.wins[w.idx] + ' - ' + game.wins[1 - w.idx], 620, 262, 34, '#ffffff', '#ffd23a');
  ctx.save(); ctx.font = 'italic bold 20px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.fillText('"' + w.def.quote + '"', 620, 320, 520); ctx.restore();
  if ((t >> 5) % 2 === 0) arcadeText('ESPACIO: ELEGIR OTRO LUCHADOR', W / 2, 440, 32, '#ffffff', '#ffd23a');
  smallText('[C] cambiar modo: ' + (p2Human ? 'J1 vs J2' : 'J1 vs CPU'), W / 2, 482, 15, '#ffd23a');
}
function drawOverlay() {
  const s = game.state, t = game.stateT;
  if (s === 'title') { drawTitle(); return; }
  if (s === 'intro') {
    if (t < 60) zoomText((game.wins[0] === 1 && game.wins[1] === 1) ? 'ROUND FINAL' : 'ROUND ' + game.round, t, '#fff6c0', '#ffb000', 90);
    else zoomText('¡LUCHA!', t - 60, '#ffffff', '#ff3b1f', 110);
  } else if (s === 'fight' && t < 25) {
    arcadeText('¡LUCHA!', W / 2, H / 2 - 40, 110, '#ffffff', '#ff3b1f', 'center', 1 - t / 25);
  } else if (s === 'ko') {
    zoomText('K.O.', t * 3, '#fff2a0', '#ff1a1a', 170);
    if (t > 70 && game.winner) arcadeText('¡GANA ' + game.winner.def.name + '!', W / 2, H / 2 + 70, 44, '#ffffff', '#ffd23a');
  } else if (s === 'timeup') {
    zoomText('¡TIEMPO!', t, '#ffffff', '#ff9a00', 110);
    if (t > 50) arcadeText(game.winner ? '¡GANA ' + game.winner.def.name + '!' : 'EMPATE', W / 2, H / 2 + 60, 44, '#ffffff', '#ffd23a');
  } else if (s === 'victory') drawVictory();
  if (game.banner) arcadeText(game.banner.text, W / 2, 140, 30, '#ffffff', '#7fd8ff', 'center', Math.min(1, game.banner.t / 30));
}

// =====================================================================
//  Render principal
// =====================================================================
function render() {
  updateTouchUi();
  bx.setTransform(1, 0, 0, 1, 0, 0);
  bx.clearRect(0, 0, W, H);
  bx.drawImage(bgC, 0, 0);
  bx.setTransform(1, 0, 0, 1, 0, 0);
  // brillo de los farolillos
  for (const [lx, ly] of [[95, 262], [505, 262], [910, 217]]) {
    const fl = 0.28 + Math.sin(game.frame * 0.2 + lx) * 0.04 + rand() * 0.03;
    const gr = bx.createRadialGradient(lx, ly, 5, lx, ly, 110);
    gr.addColorStop(0, `rgba(255,210,110,${fl})`); gr.addColorStop(1, 'rgba(255,180,80,0)');
    bx.fillStyle = gr; bx.fillRect(lx - 110, ly - 110, 220, 220);
  }
  // sombras
  for (const f of fighters) {
    const k = clamp(1 - (GROUND - f.y) / 260, .35, 1);
    bx.globalAlpha = .35 * k; ell(bx, f.x, GROUND + 2, 44 * k, 9 * k, '#000'); bx.globalAlpha = 1;
  }
  // orden de dibujo: el que ataca, delante
  const order = (p2.atk && !p1.atk) || p1.state === 'ko' ? [p1, p2] : [p2, p1];
  for (const f of order) {
    if (f.atk && f.def.special === 'rush' && f.atk.type === 'special' && f.atk.t >= f.atk.d.startup && f.atk.t < f.atk.d.startup + f.atk.d.active) {
      drawFighter(bx, f, .18, -f.facing * 70); drawFighter(bx, f, .32, -f.facing * 36);
    }
    drawFighter(bx, f);
    if (f.atk && f.def.special === 'fireball' && f.atk.type === 'special' && f.atk.t < f.atk.d.startup + 6) {
      const r = 10 + f.atk.t * 1.2, [hx, hy] = f.hand;
      const gr = bx.createRadialGradient(hx, hy, 2, hx, hy, r + 14);
      gr.addColorStop(0, 'rgba(255,240,160,.95)'); gr.addColorStop(1, 'rgba(255,90,0,0)');
      bx.fillStyle = gr; circ(bx, hx, hy, r + 14); bx.fill();
    }
  }
  for (const p of projectiles) drawProjectile(bx, p);
  for (const p of parts) { bx.globalAlpha = clamp(p.life / p.max, 0, 1); bx.fillStyle = p.col; bx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  bx.globalAlpha = 1;
  for (const s of sparks) {
    const r = (s.big ? 46 : 32) * (1 - s.t / 12);
    bx.save(); bx.translate(s.x, s.y); bx.rotate(s.t * 0.3);
    bx.fillStyle = s.col; bx.beginPath();
    for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, rad = i % 2 ? r * .35 : r; bx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
    bx.closePath(); bx.fill();
    circ(bx, 0, 0, r * .3, '#ffffff'); bx.restore();
  }
  // composición final escalada (pixel art)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  const sx = game.shake ? (rand() - .5) * game.shake : 0, sy = game.shake ? (rand() - .5) * game.shake : 0;
  ctx.drawImage(buf, sx, sy, W, H);
  if (game.state === 'ko' && game.slow > 0) { ctx.fillStyle = 'rgba(255,40,0,.08)'; ctx.fillRect(0, 0, W, H); }
  for (const f of floats) arcadeText(f.text, f.x, f.y, 24, '#ffffff', f.col, 'center', clamp(1 - f.t / 70, 0, 1));
  if (game.state === 'intro') {
    for (const f of fighters) {
      const lbl = f === p1 ? 'J1' : (p2Human ? 'J2' : 'CPU');
      arcadeText(lbl, f.x, f.y - 225, 22, '#ffffff', f === p1 ? '#7fd8ff' : '#ff8a8a');
    }
  }
  if (game.state !== 'title') drawHUD();
  drawOverlay();
}

// =====================================================================
//  Bucle principal con paso de tiempo fijo (60 Hz)
// =====================================================================
buildBG();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
